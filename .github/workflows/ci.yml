name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lean:
    name: Lean build + sorry audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: lake-

      - name: Build, which is also the sorry audit
        # The package is built under `-E hasSorry` (see lakefile.lean), so Lean
        # reports a declaration whose proof term reaches `sorryAx` as an error
        # and the build fails on it. The previous separate step passed
        # `-- --run-linter=sorryIn`, which runs no linter: Lean has no
        # `--run-linter` flag and Lake forwards no arguments after `--`.
        run: lake build

  rust:
    name: Rust specs tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-specs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pin to a specific version to avoid surprise lint failures from new
        # stable releases. Bump deliberately when ready.
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-specs/target
          key: cargo-${{ hashFiles('rust-specs/Cargo.lock') }}
          restore-keys: cargo-

      - name: Run tests (proptest + Wycheproof)
        run: cargo test --release

      - name: Clippy
        run: cargo clippy -- -D warnings
