name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lean:
    name: Lean build + sorry audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: lake-

      - name: Build
        run: lake build

      - name: Sorry audit
        run: lake build LibcruxSpecs -- --run-linter=sorryIn

  rust:
    name: Rust specs tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-specs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-specs/target
          key: cargo-${{ hashFiles('rust-specs/Cargo.lock') }}
          restore-keys: cargo-

      - name: Run tests (proptest + Wycheproof)
        run: cargo test --release

      - name: Clippy
        run: cargo clippy -- -D warnings
