[workspace]

[package]
name = "libcrux-specs"
version = "0.1.0"
edition = "2021"
description = "Pure Rust hacspec-style specifications of all libcrux primitives"

[dependencies]
# Zero dependencies — all self-contained

[dev-dependencies]
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reference implementations from libcrux (for differential testing)
libcrux-sha2 = "0.0.6"
libcrux-hmac = "0.0.6"
libcrux-hkdf = "0.0.6"
libcrux-aesgcm = "0.0.7"
libcrux-curve25519 = "0.0.6"
libcrux-p256 = "0.0.6"
libcrux-blake2 = "0.0.6"
libcrux-chacha20poly1305 = "0.0.6"
libcrux-ed25519 = "0.0.7"
libcrux-ecdsa = "0.0.6"
libcrux-poly1305 = "0.0.5"
# RustCrypto AES for block-level testing (libcrux doesn't expose raw block)
aes = "0.8"
# Google's Project Wycheproof test vectors
wycheproof = "0.6"
