[workspace]

[package]
name = "libcrux-specs"
version = "0.1.0"
edition = "2021"
description = "Pure Rust hacspec-style specifications of all libcrux primitives"

[dependencies]
# Zero dependencies — all self-contained

[dev-dependencies]
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
